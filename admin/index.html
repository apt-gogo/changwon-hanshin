<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="noindex,nofollow" name="robots"/>
<title>관리자 로그인 | APT-GOGO</title>
<link href="css/admin.css?v=20260913-3" rel="stylesheet"/>
</head>
<body class="admin-body">
<main class="login-shell">
<section class="login-card">
<p class="admin-eyebrow">APT-GOGO ADMIN</p>
<h1>관심고객 관리</h1>
<p class="login-help">등록된 관심고객 정보를 확인하려면 관리자 계정으로 로그인하세요.</p>
<form class="admin-form" id="adminLoginForm">
<label>
<span>이메일</span>
<input autocomplete="username" id="adminEmail" required="" type="email"/>
</label>
<label>
<span>비밀번호</span>
<input autocomplete="current-password" id="adminPassword" required="" type="password"/>
</label>
<button id="loginButton" type="submit">로그인</button>
<p aria-live="polite" class="admin-status" id="loginStatus" role="status"></p>
</form>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/site-config.js?v=20260913-3"></script><script src="../js/supabase-config.js"></script>
<script src="js/login.js?v=20260913-3"></script>
</body>
</html>
